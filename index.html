<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Farmer | Vencendo a Fome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-app">
        <!-- Background Ambient Tiles -->
        <div id="ambient-overlay"></div>
        
        <!-- Sidebar Navigation -->
        <aside id="sidebar">
            <div class="brand">
                <h1>Survival<span>Farmer</span></h1>
                <div class="edition">Vencendo a Fome</div>
            </div>

            <!-- Survival Status -->
            <div class="status-panel">
                <div class="status-item hunger">
                    <div class="status-header">
                        <span class="label">Energia Vital</span>
                        <span id="hunger-value" class="value">100%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="hunger-bar-fill" class="fill"></div>
                    </div>
                </div>

                <div class="status-item currency">
                    <div class="sun-icon">☀️</div>
                    <div class="currency-info">
                        <span class="label">Luz Acumulada</span>
                        <span id="sunlight-count" class="amount">20</span>
                    </div>
                </div>
            </div>

            <!-- Inventory: Seeds -->
            <div class="inventory-card">
                <h3>Sementes Disponíveis</h3>
                <div id="seed-selector" class="seed-grid">
                    <!-- Dynamic seeds -->
                </div>
            </div>

            <!-- Actions Info -->
            <div class="storage-card">
                <div class="storage-info">
                    <span class="label">Sobrevivência</span>
                    <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 5px;">
                        Caminhe sobre as plantações maduras para consumi-las e recuperar sua energia.
                    </p>
                </div>
            </div>

            <div class="stats-footer">
                <div class="stat">
                    <span class="label">Resistência</span>
                    <span id="play-time">00:00</span>
                </div>
            </div>
        </aside>

        <!-- Main Viewport Target -->
        <main id="game-view">
            <div id="farm-scene">
                <!-- Grid will be rendered here -->
                <div id="farm-grid"></div>
                
                <!-- Player Layer -->
                <div id="player-container">
                    <div id="player">
                        <div class="player-visual">🧑‍🌾</div>
                        <div class="player-aura"></div>
                        <div class="interaction-indicator">
                            <span class="key-hint">E</span>
                        </div>
                    </div>
                </div>

                <!-- Particle Layer -->
                <canvas id="particle-canvas"></canvas>
            </div>
        </main>

        <!-- Dynamic Feedback -->
        <div id="notification-area"></div>

        <!-- Overlays -->
        <div id="game-over" class="overlay hidden">
            <div class="overlay-modal">
                <div class="death-icon">💀</div>
                <h2>A FOME VENCEU</h2>
                <p>O ciclo da vida continuará, mas sem você.</p>
                <div class="stats-summary">
                    <div class="final-stat">
                        <span>Tempo:</span>
                        <span id="final-time">00:00</span>
                    </div>
                </div>
                <button class="retry-btn" onclick="location.reload()">RECOMEÇAR JORNADA</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
